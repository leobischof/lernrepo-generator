[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lernrepo-generator"
version = "0.1.0"
description = "Quellengebundene Wissensrepos für beliebige Vorlesungen"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[project.optional-dependencies]
pipeline = ["pymupdf>=1.24", "genanki>=0.13", "markdown>=3.5", "zstandard>=0.22"]
dev = ["pytest>=8"]

[project.scripts]
lernrepo = "pipeline.__main__:main"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
